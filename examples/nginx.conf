# Layer-1 Nginx Gateway Disguise for kreamlink Hub
# Active probes without the matching WebSocket upgrade + disguise header
# fall back to a normal website/static response.

map "$http_upgrade:$http_sec_websocket_protocol" $kreamlink_backend {
    default             http://127.0.0.1:8081; # Decoy site / normal web app
    "websocket:kream.v1" http://127.0.0.1:8080; # kreamlink Hub
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/v1/stream {
        proxy_pass $kreamlink_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
